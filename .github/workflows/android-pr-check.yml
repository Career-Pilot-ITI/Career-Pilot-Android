name: Android PR Check

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build, Test & Lint (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        flavor: [prod, fake]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant gradlew permission
        run: chmod +x ./gradlew

      - name: Build, test and lint
        run: |
          FLAVOR_CAPITALIZED=$(echo "${{ matrix.flavor }}" | awk '{print toupper(substr($0,1,1))tolower(substr($0,2))}')
          ./gradlew \
            -Pcareerpilot.baseUrl="${{ secrets.CAREERPILOT_BASE_URL }}" \
            "assemble${FLAVOR_CAPITALIZED}Debug" \
            "test${FLAVOR_CAPITALIZED}DebugUnitTest" \
            "lint${FLAVOR_CAPITALIZED}Debug" \
            --stacktrace \
            --info

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ matrix.flavor }}
          path: |
            **/build/reports/
            **/build/test-results/

      - name: Upload debug APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ matrix.flavor }}-debug
          path: app/build/outputs/apk/${{ matrix.flavor }}/debug/
          if-no-files-found: error
