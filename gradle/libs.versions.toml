lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.4.10"
composeBom = "2026.06.01"
#
lottieCompose = "6.7.1"
kotlinxDatetime = "0.8.0"
hilt = "2.60.1"
hiltAndroidx = "1.4.0"
room = "2.8.4"
workManager = "2.11.2"
